<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CapitalSyncFX | Payment</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

body{
background:#020617;
font-family:Arial,sans-serif;
color:white;
}

.card{
background:#0f172a;
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:24px;
}

.option{
cursor:pointer;
padding:18px;
border:2px solid #334155;
border-radius:16px;
transition:.3s;
}

.option:hover{
border-color:#06b6d4;
}

.btn{
width:100%;
padding:14px;
border-radius:14px;
background:#06b6d4;
font-weight:bold;
margin-top:20px;
}

input{
width:100%;
padding:14px;
margin-top:10px;
border-radius:12px;
background:#1e293b;
color:white;
border:none;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="max-w-lg mx-auto p-6">

<h1 class="text-3xl font-bold mb-6">
Deposit Payment
</h1>

<div class="card">

<h2 class="text-xl font-bold mb-4">

Choose Payment Method

</h2>

<div class="option mb-4" onclick="showBank()">

<i class="fas fa-building-columns text-cyan-400 mr-2"></i>

Bank Transfer

</div>

<div class="option" onclick="showCrypto()">

<i class="fab fa-bitcoin text-yellow-400 mr-2"></i>

Pay with Crypto

</div>

</div>

<!-- ================= BANK ================= -->

<div id="bankBox" class="card mt-6 hidden">

<h2 class="text-xl font-bold mb-4">

Bank Details

</h2>

<p><b>Bank:</b> Boost Ewallet</p>

<p class="mt-2"><b>Account Number:</b> 100881856786</p>

<p class="mt-2"><b>Account Name:</b> Ganabathy</p>

<input
type="number"
id="amount"
placeholder="Deposit Amount">

<input
type="text"
id="reference"
placeholder="Transaction Reference">

<label class="block mt-4">

Upload Receipt

</label>

<input
type="file"
id="receipt">

<button
id="submitBank"
class="btn">

Submit Deposit

</button>

</div>

<!-- ================= CRYPTO ================= -->

<div id="cryptoBox" class="card mt-6 hidden">

<h2 class="text-xl font-bold mb-4">

Crypto Payment

</h2>

<img
src="20260804_125958.png"
class="w-56 mx-auto rounded-xl">

<p class="text-center text-slate-400 mt-3">

Scan this QR Code to complete payment

</p>

<input
type="number"
id="cryptoAmount"
placeholder="Deposit Amount">

<input
type="text"
id="cryptoReference"
placeholder="Transaction Reference">

<label class="block mt-4">

Upload Receipt

</label>

<input
type="file"
id="cryptoReceipt">

<button
id="submitCrypto"
class="btn">

Submit Deposit

</button>

</div>

</div>

<script>

function showBank(){

document.getElementById("bankBox").classList.remove("hidden");

document.getElementById("cryptoBox").classList.add("hidden");

}

function showCrypto(){

document.getElementById("cryptoBox").classList.remove("hidden");

document.getElementById("bankBox").classList.add("hidden");

}

</script>

<!-- Firebase code goes here in Part B -->
<script type="module">

/* ===========================
   FIREBASE IMPORTS
=========================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* ===========================
   FIREBASE CONFIG
=========================== */

const firebaseConfig = {

apiKey: "AIzaSyB1k9_w1-SwQ_68sQ4yM9NOF_clU9_PKg0",

authDomain: "green-54f87.firebaseapp.com",

databaseURL: "https://green-54f87-default-rtdb.firebaseio.com",

projectId: "green-54f87",

storageBucket: "green-54f87.appspot.com",

messagingSenderId: "13622576743",

appId: "1:13622576743:web:93615f9e92d01a3d7d36c2"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const storage = getStorage(app);

const auth = getAuth(app);


/* ===========================
   SUBMIT PAYMENT
=========================== */

async function submitDeposit(method){

const user = auth.currentUser;

if(!user){

alert("Please login first.");

return;

}

let amount;
let reference;
let file;

if(method==="Bank Transfer"){

amount=document.getElementById("amount").value;

reference=document.getElementById("reference").value;

file=document.getElementById("receipt").files[0];

}else{

amount=document.getElementById("cryptoAmount").value;

reference=document.getElementById("cryptoReference").value;

file=document.getElementById("cryptoReceipt").files[0];

}

if(amount=="" || Number(amount)<=0){

alert("Enter deposit amount.");

return;

}

if(reference==""){

alert("Enter transaction reference.");

return;

}

if(!file){

alert("Upload your payment receipt.");

return;

}

try{

const fileName="receipts/"+user.uid+"/"+Date.now()+"_"+file.name;

const storageRef=ref(storage,fileName);

await uploadBytes(storageRef,file);

const receiptURL=await getDownloadURL(storageRef);

await addDoc(collection(db,"deposits"),{

uid:user.uid,

email:user.email,

amount:Number(amount),

reference:reference,

method:method,

receipt:receiptURL,

status:"Pending",

balanceUpdated:false,

createdAt:serverTimestamp()

});

alert("Deposit submitted successfully.\nWaiting for Admin Approval.");

location.reload();

}catch(error){

alert(error.message);

console.log(error);

}

}


/* ===========================
   BUTTONS
=========================== */

document
.getElementById("submitBank")
.onclick=()=>submitDeposit("Bank Transfer");

document
.getElementById("submitCrypto")
.onclick=()=>submitDeposit("Cryptocurrency");


/* ===========================
   LOGIN CHECK
=========================== */

onAuthStateChanged(auth,(user)=>{

if(!user){

alert("Please login to continue.");

window.location.href="login.html";

}

});

</script>

</body>
</html>
